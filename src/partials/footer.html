  <footer class="footer">
    <div class="shell footer__inner">
      <div class="footer__col">
        <p class="footer__sig">{{author}}</p>
        <p class="footer__meta">{{s_place}} · {{s_footer_about}}</p>
      </div>
      <nav class="footer__col footer__links" aria-label="{{s_elsewhere}}">
        <a href="mailto:{{email}}">{{s_email}}</a>
        <a href="{{linkedin}}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="{{github}}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{rel}}feed.xml">RSS</a>
      </nav>
      <div class="footer__col footer__end">
        <p class="footer__meta">© <span id="year">{{year}}</span> · {{s_footer_tech}}</p>
        <p><a class="footer__top" href="#top">{{s_top}} <span aria-hidden="true">↑</span></a></p>
      </div>
    </div>
  </footer>
