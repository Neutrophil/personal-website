<svg viewBox="0 0 900 330" role="img" aria-labelledby="d3-title">
  <title id="d3-title">Four layers: Streamlit pages on top, then pure domain logic, then storage and a TTL cache, then the provider router — the only layer permitted to reach the network. A page calling a provider directly is forbidden.</title>
  <defs>
    <marker id="d3-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--border-lit)" />
    </marker>
  </defs>

  <!-- layer 1 -->
  <rect class="d-fill-elev d-stroke" x="20" y="16" width="520" height="56" rx="8" stroke-width="1" />
  <text class="d-label" x="40" y="41">app/ · Streamlit pages</text>
  <text class="d-label--sm" x="40" y="59">one router, N page modules — no business logic here</text>

  <!-- layer 2 -->
  <rect class="d-fill-elev d-accent" x="20" y="88" width="520" height="56" rx="8" stroke-width="1.3" />
  <text class="d-label" x="40" y="113">core/ · domain logic</text>
  <text class="d-label--sm" x="40" y="131">pure, injectable, zero Streamlit imports — this is what the tests exercise</text>

  <!-- layer 3 -->
  <rect class="d-fill-elev d-stroke" x="20" y="160" width="520" height="56" rx="8" stroke-width="1" />
  <text class="d-label" x="40" y="185">storage/ · SQLite + TTL cache</text>
  <text class="d-label--sm" x="40" y="203">cache-aside; a failed refresh degrades to stale, never to a crash</text>

  <!-- layer 4 -->
  <rect class="d-fill-elev d-stroke" x="20" y="232" width="520" height="56" rx="8" stroke-width="1" />
  <text class="d-label" x="40" y="257">data/providers/router.py</text>
  <text class="d-label--sm" x="40" y="275">the only door to the network</text>

  <!-- vertical flow -->
  <g class="d-stroke" fill="none" stroke-width="1.2" marker-end="url(#d3-arw)">
    <path d="M280 72 L280 86" />
    <path d="M280 144 L280 158" />
    <path d="M280 216 L280 230" />
  </g>

  <!-- the network, outside the box -->
  <rect x="620" y="232" width="260" height="56" rx="8" fill="none" stroke="var(--border-lit)"
        stroke-width="1" stroke-dasharray="5 4" />
  <text class="d-label--sm" x="750" y="257" text-anchor="middle">Yahoo · akshare · FX</text>
  <text class="d-label--sm" x="750" y="275" text-anchor="middle">free, rate-limited, occasionally wrong</text>
  <g class="d-stroke" fill="none" stroke-width="1.2" marker-end="url(#d3-arw)">
    <path d="M540 260 L618 260" />
  </g>

  <!-- the forbidden shortcut -->
  <path d="M560 44 C 700 44, 790 120, 800 226" fill="none" stroke="var(--text-faint)"
        stroke-width="1.2" stroke-dasharray="4 5" opacity=".8" />
  <g stroke="var(--text-faint)" stroke-width="1.8" stroke-linecap="round">
    <line x1="770" y1="120" x2="790" y2="140" />
    <line x1="790" y1="120" x2="770" y2="140" />
  </g>
  <text class="d-label--sm" x="620" y="106">a page must never</text>
  <text class="d-label--sm" x="620" y="120">reach past the router</text>

  <!-- boundary bracket -->
  <path class="d-accent" fill="none" stroke-width="1.2"
        d="M556 16 L570 16 L570 288 L556 288" opacity=".55" />
  <text class="d-label--sm" x="582" y="160" fill="var(--accent)">testable</text>
  <text class="d-label--sm" x="582" y="174" fill="var(--accent)">offline</text>

  <text class="d-label--sm" x="20" y="316">Every project in the workspace has this shape. Deviating from it is what the review catches.</text>
</svg>
